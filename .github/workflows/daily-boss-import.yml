name: Daily Instagram Boss Import

permissions:
  contents: write

on:
  schedule:
    # 12:00 America/Sao_Paulo == 15:00 UTC (cron uses UTC)
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build pokemon hashes
        run: python scripts/build_pokemon_hashes.py

      - name: Run importer (fetch story + identify + update)
        env:
          INSTAGRAM_USER: ${{ secrets.INSTAGRAM_USER }}
          INSTAGRAM_PASS: ${{ secrets.INSTAGRAM_PASS }}
        run: |
          set -e
          python scripts/story_boss_importer.py --instagram-target pstoryonline --login-user "$INSTAGRAM_USER" --login-pass "$INSTAGRAM_PASS" --auto-update || echo "No update or fetch error"

      - name: Commit and push changes
        run: |
          if git status --porcelain | grep -q bosses/bosses.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bosses/bosses.js
            git commit -m "chore: auto-update boss from Instagram story"
            git push
          else
            echo "No changes to commit"
          fi
