name: Update Rattata Timer

permissions:
  actions: write
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-rattata-timer.yml'
      - '.github/scripts/update-rattata-timer.js'
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'Queue another monitor run after this one finishes'
        required: false
        default: 'true'

concurrency:
  group: streamers-data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build streamer status snapshot
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_OAUTH_TOKEN: ${{ secrets.TWITCH_OAUTH_TOKEN }}
        run: |
          node .github/scripts/update-streamers-status.js

      - name: Monitor Rattata timer
        env:
          TWITCH_OAUTH_TOKEN: ${{ secrets.TWITCH_OAUTH_TOKEN }}
          RAT_MONITOR_MS: 1440000
        run: |
          node .github/scripts/update-rattata-timer.js

      - name: Commit streamer-rat-timer.json to streamers-data branch
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/poke-streamers-data
          cp streamer-rat-timer.json /tmp/poke-streamers-data/streamer-rat-timer.json
          rm -f streamers-status.json streamer-rat-timer.json
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/streamers-data; then
            git checkout -B streamers-data origin/streamers-data
          else
            git checkout -B streamers-data
          fi
          cp /tmp/poke-streamers-data/streamer-rat-timer.json streamer-rat-timer.json
          git add streamer-rat-timer.json
          if git diff --cached --quiet; then
            echo "No changes to streamer-rat-timer.json"
          else
            git commit -m "chore: update rattata timer"
            if [ -n "$REPO_PAT" ]; then
              git push "https://${REPO_PAT}@github.com/${{ github.repository }}" streamers-data --force
            else
              git push -u origin streamers-data --force
            fi
          fi

      - name: Queue next Rattata timer monitor
        if: ${{ success() && (github.event_name == 'schedule' || inputs.chain == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-rattata-timer.yml --repo "${{ github.repository }}" --ref main -f chain=true
