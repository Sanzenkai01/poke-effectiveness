name: Update Rattata Timer

permissions:
  contents: write

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

concurrency:
  group: rattata-timer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check 40 minute cadence
        id: cadence
        run: |
          minute_mod=$(( ($(date +%s) / 60) % 40 ))
          if [ "$minute_mod" -lt 10 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this run; outside the 40 minute cadence window."
          fi

      - name: Build streamer status snapshot
        if: steps.cadence.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_OAUTH_TOKEN: ${{ secrets.TWITCH_OAUTH_TOKEN }}
        run: |
          node .github/scripts/update-streamers-status.js

      - name: Monitor Rattata timer
        if: steps.cadence.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TWITCH_CHAT_USERNAME: ${{ secrets.TWITCH_CHAT_USERNAME }}
          TWITCH_CHAT_OAUTH_TOKEN: ${{ secrets.TWITCH_CHAT_OAUTH_TOKEN }}
          RAT_MONITOR_MS: 1500000
        run: |
          node .github/scripts/update-rattata-timer.js

      - name: Commit streamer-rat-timer.json to streamers-data branch
        if: steps.cadence.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/poke-streamers-data
          cp streamer-rat-timer.json /tmp/poke-streamers-data/streamer-rat-timer.json
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/streamers-data; then
            git checkout -B streamers-data origin/streamers-data
          else
            git checkout -B streamers-data
          fi
          cp /tmp/poke-streamers-data/streamer-rat-timer.json streamer-rat-timer.json
          git add streamer-rat-timer.json
          if git diff --cached --quiet; then
            echo "No changes to streamer-rat-timer.json"
          else
            git commit -m "chore: update rattata timer"
            if [ -n "$REPO_PAT" ]; then
              git push "https://${REPO_PAT}@github.com/${{ github.repository }}" streamers-data --force
            else
              git push -u origin streamers-data --force
            fi
          fi
