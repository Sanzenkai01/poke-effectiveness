<div class="battle-pass-shell">
  <section class="battle-pass-hero" aria-labelledby="battle-pass-title">
    <span class="battle-pass-eyebrow">Utilidades</span>
    <h2 id="battle-pass-title">Passe de Batalha</h2>
    <p class="battle-pass-hero__text">Selecione quantas tipagens quiser. Com 3 ou mais, serão exibidos Pokémon que compartilham pelo menos 2 delas.</p>
  </section>

  <section class="battle-pass-tool" aria-labelledby="battle-pass-tool-title">
    <div class="battle-pass-tool__header">
      <div class="battle-pass-tool__header-content">
        <span class="battle-pass-tool__eyebrow">Captura</span>
        <h3 id="battle-pass-tool-title">Filtro por tipagem</h3>
      </div>
      <button id="battle-pass-clear" class="battle-pass-clear" type="button">Limpar seleção</button>
    </div>

    <div id="battle-pass-location-cards" class="battle-pass-location-cards" aria-label="Localizações de bosses e Eeveelutions"></div>

    <div id="battle-pass-type-picker" class="battle-pass-type-picker" aria-label="Seleção de tipagens"></div>

    <div class="battle-pass-filters-section">
      <div class="battle-pass-level-filter">
        <label for="battle-pass-level-select" class="battle-pass-level-filter__label">Filtrar por level:</label>
        <select id="battle-pass-level-select" class="battle-pass-level-filter__select" aria-label="Selecione o level mínimo">
          <option value="1">Todos os levels</option>
        </select>
      </div>
    </div>

    <div class="battle-pass-toolbar">
      <strong id="battle-pass-summary" class="battle-pass-toolbar__summary">Selecione as tipagens</strong>
    </div>

    <section id="battle-pass-hidden-pokemon" class="battle-pass-hidden-pokemon" aria-labelledby="battle-pass-hidden-title" hidden>
      <h4 id="battle-pass-hidden-title" class="battle-pass-hidden-pokemon__title">Pokémon que você não quer capturar</h4>
      <div id="battle-pass-hidden-list" class="battle-pass-hidden-pokemon__list"></div>
    </section>

    <div id="battle-pass-results" class="battle-pass-results" aria-live="polite"></div>
  </section>
</div>
