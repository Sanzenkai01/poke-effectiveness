<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Police cap">
  <!-- Crown (navy dome) -->
  <path d="M12 24 Q12 12 32 12 Q52 12 52 24 L52 38 L12 38 Z" fill="#1e40af"/>
  <!-- Top highlight, subtle sheen -->
  <path d="M16 20 Q16 14 32 14 Q48 14 48 20 L48 22 L16 22 Z" fill="#3b5fd1" opacity="0.45"/>
  <!-- Hatband (dark stripe just above the visor) -->
  <rect x="10" y="38" width="44" height="5" fill="#0f1e4a"/>
  <!-- Visor (black, widens slightly past the hatband) -->
  <path d="M8 43 L56 43 Q56 50 50 50 L14 50 Q8 50 8 43 Z" fill="#0a0f24"/>
  <!-- Gold star badge on the front -->
  <g transform="translate(32 30)">
    <path d="M0 -7 L1.9 -2.2 L7 -2.2 L2.9 0.8 L4.4 5.7 L0 2.8 L-4.4 5.7 L-2.9 0.8 L-7 -2.2 L-1.9 -2.2 Z"
          fill="#fbbf24" stroke="#b45309" stroke-width="0.7" stroke-linejoin="round"/>
  </g>
</svg>
